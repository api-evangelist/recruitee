      summary: candidates/:id/update_cv
      description: Allows to update candidate's CV file - local or remote.
      operationId: candidatesidupdate_cv
      parameters:
      - name: company_id
        in: path
        description: Company ID. A company subdomain can also be used.
        schema:
          type: integer
          format: int32
        required: true
      - name: id
        in: path
        description: Candidate ID
        schema:
          type: integer
          format: int32
        required: true
