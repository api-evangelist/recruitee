            schema:
              type: object
              properties:
                candidate:
                  properties:
                    remote_cv_url:
                      type: string
                      description: Link to file saved on some external website. You can use candidate[cv] instead if you want to upload a file - see examples.
                  required:
                  - remote_cv_url
