      x-readme:
        code-samples:
        - language: curl
          code: "curl -X POST \\\n  https://api.recruitee.com/c/{company_id}/attachments \\\n  -H 'Authorization: Bearer {token}' \\\n  -H 'content-type: multipart/form-data' \\\n  -F 'attachment[candidate_id]={candidate_id}' \\\n  -F 'attachment[file]=@/path/to/file.pdf'"
          name: Upload to candidate (form-data)
        - language: curl
          code: "curl -X POST \\\n  https://api.recruitee.com/c/{company_id}/attachments \\\n  -H 'Authorization: Bearer {token}' \\\n  -H 'content-type: multipart/form-data' \\\n  -F 'attachment[offer_id]={offer_id}' \\\n  -F 'attachment[file]=@/path/to/file.pdf'"
