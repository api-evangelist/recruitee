    get:
      summary: /candidates
      description: 'Calling the `/candidates` endpoint will return a collection of the company''s candidates. If `limit` and `offset` are not provided, all candidates will be returned.


        This endpoint hits the database directly, so getting the response might take some time, depending on the number of candidates.


        WARNING:

        For searching candidates it is advised to use `/search/new/candidates` endpoint for better performance.'
      operationId: candidates-get
      parameters:
      - name: company_id
        in: path
        description: Company ID. A company subdomain can also be used.
        schema:
          type: integer
          format: int32
          default: ''
        required: true
      - name: limit
        in: query
        description: Specifies the number of candidates to retrieve
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        description: Skip number of candidates from the begining, used for ‘load more’, offset for next page should be current offset + limit
        schema:
          type: integer
          format: int32
      - name: created_after
        in: query
        description: Show only candidates created after given date (yyyy-mm-ddThh:mm:ss) Letter 'T' separates the date and time. Also works without seconds.
        schema:
          type: string
          format: date-time
      - name: disqualified
        in: query
        description: Show only disqualified candidates who are disqualified in at least one job (should be string ‘true’ or ‘1’).
        schema:
          type: boolean
      - name: qualified
        in: query
        description: Show only disqualified candidates who are qualified in at least one job (should be string ‘true’ or ‘1’).
        schema:
          type: boolean
      - name: ids
        in: query
        description: 'List of IDs separated by comma, example: 234221,4211412,535432'
        schema:
          type: string
      - name: offer_id
        in: query
        description: Filter by offer
        schema:
          type: string
      - name: query
        in: query
        description: Search query for candidate’s name or offer
        schema:
          type: string
      - name: sort
        in: query
        description: 'Sorting options: by_date, by_last_message'
        schema:
          type: string
          default: by_date
      - name: with_messages
        in: query
        description: Show only candidates with messages (should be string ‘true’ or ‘1’)
        schema:
          type: boolean
      - name: with_my_messages
        in: query
        description: Show only candidates with messages that current admin sent (should be string ‘true’ or ‘1’)
        schema:
          type: boolean
