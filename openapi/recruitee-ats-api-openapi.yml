openapi: 3.1.0
info:
  title: ats-api
  version: '1.0'
servers:
- url: https://api.recruitee.com
security:
- sec0: []
x-readme-fauxas: true
paths:
  /c/{company_id}/attachments:
    post:
      summary: /attachments
      description: 'Allows to upload files to: offer or candidate.'
      operationId: attachments-post
      parameters:
      - name: company_id
        in: path
        schema:
          type: string
        required: true
      - name: Content-Type
        in: header
        schema:
          type: string
          default: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                attachment:
                  properties:
                    remote_file_url:
                      type: string
                      description: Link to file saved on some external website. You can use attachment[file] instead if you want to upload a file - see examples.
                    candidate_id:
                      type: string
                      description: If you add candidate ID, the file will show in candidate profile
                    offer_id:
                      type: string
                      description: If you add offer ID, the file will show in offer file tab
                  required:
                  - remote_file_url
                  type: object
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"attachment\": {\n        \"admin_id\": 135145,\n        \"candidate_id\": 27868999,\n        \"created_at\": \"2021-08-25T07:19:21.268251Z\",\n        \"extension\": \"pdf\",\n        \"file_size\": 400,\n        \"file_url\": \"https://recruitee-main.s3.eu-central-1.amazonaws.com/attachments/14319394/test.rtf?response-content-disposition=attachment&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=AKIAQYHB7CA5RLR4Y3ON%2F20210825%2Feu-central-1%2Fs3%2Faws4_request&X-Amz-Date=20210825T071923Z&X-Amz-Expires=36000&X-Amz-SignedHeaders=host&X-Amz-Signature=8de70db00fefe8ce54f6e95642a10b1f4065d2fc8c228ec60e146737d2ef04ab\",\n        \"filename\": \"file.pdf\",\n        \"guest_id\": null,\n        \"id\": 14319394,\n        \"kind\": \"document\",\n        \"offer_id\": null,\n        \"pdf_thumbnail_url\": \"https://recruitee-main.s3.eu-central-1.amazonaws.com/attachments/14319394/pdf_thumbnail_test.png?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=AKIAQYHB7CA5RLR4Y3ON%2F20210825%2Feu-central-1%2Fs3%2Faws4_request&X-Amz-Date=20210825T071923Z&X-Amz-Expires=36000&X-Amz-SignedHeaders=host&X-Amz-Signature=ebd86bc0c155d6f245fd9d8108c4382eff6ddb8ba7a3265c633de3d221ce4da8\"\
                    ,\n        \"pdf_url\": \"https://recruitee-main.s3.eu-central-1.amazonaws.com/attachments/14319394/pdf_test.pdf?response-content-disposition=inline&response-content-type=application%2Fpdf&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=AKIAQYHB7CA5RLR4Y3ON%2F20210825%2Feu-central-1%2Fs3%2Faws4_request&X-Amz-Date=20210825T071923Z&X-Amz-Expires=36000&X-Amz-SignedHeaders=host&X-Amz-Signature=f543fae1740273218d739e574406fad032d2c04abbe6bce7c56361bfe4c49218\",\n        \"status\": \"ok\",\n        \"uploader\": \"Admin\",\n        \"visibility\": {\n            \"admin_ids\": [],\n            \"level\": \"public\",\n            \"role_ids\": []\n        }\n    },\n    \"references\": [\n        {\n            \"admin_id\": 135145,\n            \"adminapp_url\": \"https://app.recruitee.com/#/dashboard/overview?candidate=27868999&company=49498\",\n            \"created_at\": \"2021-08-25T07:19:08.801242Z\",\n            \"emails\": [],\n            \"example\": false,\n \
