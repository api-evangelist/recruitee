  /c/{company_id}/candidates:
    post:
      summary: /candidates
      description: Manually add candidate to your account. Watch out when testing the endpoint here! It will create a candidate in your company!
      operationId: candidates-post
      parameters:
      - name: company_id
        in: path
        description: Company ID. A company subdomain can also be used.
        schema:
          type: integer
          format: int32
        required: true
      - name: Content-Type
        in: header
        schema:
          type: string
          default: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                candidate:
                  properties:
                    name:
                      type: string
                      description: Candidate name
                    remote_cv_url:
                      type: string
                      description: Link to file saved on some external website. You can use candidate[cv] instead if you want to upload a file - see examples.
                    emails:
                      type: array
                      description: Array of emails
                      items:
                        type: string
                    phones:
                      type: array
                      description: Array of phone numbers
                      items:
                        type: string
                    social_links:
                      type: array
                      description: Array of social links
                      items:
                        type: string
                    links:
                      type: array
                      description: Array of links
                      items:
                        type: string
                    cover_letter:
                      type: string
                      description: Candidate's cover letter
                    sources:
                      type: array
                      description: Array of source tags
                      items:
                        type: string
                  required:
                  - name
                  type: object
                offers:
                  type: array
                  description: Offers to which the candidate will be assigned with default stage. You can also pass one ID as `offer_id`
                  items:
                    type: integer
                    format: int32
