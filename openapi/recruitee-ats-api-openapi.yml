                type: object
                properties:
                  error:
                    type: string
                    example: Resource access requires authentication!
                  error_code: {}
        '422':
          description: '422'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"error\": [\n        \"File can't be blank\"\n    ],\n    \"error_fields\": {\n        \"file\": [\n            \"can't be blank\"\n        ]\n    }\n}"
