  /offers/{offer_slug}/candidates:
    post:
      summary: /offers/:offer_slug/candidates
      description: 'Apply for the job offer (create candidate). By default, these fields are required: ```name```, ```phone```, ```email```, ```cv```. However, you can turn off the requirements for all of them (besides ```name``` and ```email```) in the offer''s settings for the application form.


        API also allows answering the job’s questions. You just need to attach a list of answers to the request.'
      operationId: offersoffer_idcandidates
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
          default: application/json
      - in: path
        name: offer_slug
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                candidate:
                  properties:
                    name:
                      type: string
                    email:
                      type: string
                    phone:
                      type: string
                    remote_cv_url:
                      type: string
